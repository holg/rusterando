[package]
name = "rusterando-server"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
# Upstream default — Davids' deployment overlay rewrites this back to
# `davidspizzeria-server` before building so the on-server systemd unit
# and existing prod paths don't have to change.
name = "rusterando-server"
path = "src/main.rs"

[build-dependencies]
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = []
# Exposes POST /api/kitchen/debug/inject — broadcasts an arbitrary
# KitchenEvent (JSON body) into the outbox + tokio channel. Useful for
# smoke-testing the printer chain without going through Stripe. NEVER
# enable in production builds.
debug-inject = []

[dependencies]
rusterando-shared = { workspace = true }
rusterando-frontend = { workspace = true, features = ["ssr"] }

# Kitchen printer subsystem (see src/kitchen.rs). The Pi binary lives at
# crates/rusterando-printer/ and depends on the same protocol crate.
kitchen-protocol = { workspace = true }
postcard = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

leptos = { workspace = true, features = ["ssr"] }
leptos_axum = { workspace = true }
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }

sqlx = { workspace = true }
tower-cookies = "0.11"

qrcode = { workspace = true }
chrono = { workspace = true }
async-stripe = { workspace = true }
reqwest = { workspace = true }
# APNs HTTP/2 client. Token-based auth (.p8 key) — see APNS_KEY_PATH env.
# OpenSSL crypto backend instead of aws-lc-rs so cross-compilation
# uses the already-cross-built openssl in $HOME/opt/openssl_for_cross_*.
# aws-lc-rs ships its own C+asm crypto via aws-lc-sys, which fails
# under aarch64-unknown-linux-gnu-gcc on a macOS host without a
# fully-wired-up sysroot.
apns-h2 = { version = "0.11", default-features = false, features = ["openssl", "pem"] }
async-trait = "0.1"
# Content-hash filename for /api/admin/upload_image so duplicates dedupe.
sha2 = "0.10"
# Cover-image normalisation: the Typst template hardcodes
# `image("/img/cover.jpg")`, so Typst always decodes the active cover as
# JPEG. Admins may upload PNG, so we transcode PNG→JPEG before handing the
# bytes to Typst. Pure-Rust jpeg+png codecs only (no C deps) so the
# aarch64 cross-build stays clean.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
glob = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
http = { workspace = true }
anyhow = { workspace = true }
typst = "0.14"
typst-pdf = "0.14"
typst-kit = { version = "0.14", features = ["embed-fonts"] }
ecow = "0.2"
comemo = "0.4"

# RLIMIT_NOFILE lookup for src/health.rs (process-health observability).
# Linux-only; the call is cfg-gated and macOS dev builds skip the syscall
# entirely, returning None for the fd-limit field.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
