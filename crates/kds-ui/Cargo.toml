[package]
name = "kds-ui"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Holger Trahe <trahe@mac.com>"]
repository = "https://github.com/holg/rusterando"
description = "Kitchen display screen (Slint) shared by the STM32 board and the browser mirror"
publish = false

# Not a workspace member (like rusterando-printer): Slint is a heavy dep the
# server must never pull in. The consumer picks Slint's backend + renderer
# (feature unification): the board linuxkms + software, the browser winit +
# femtovg (WebGL).

[features]
default = ["std"]
# Slint's std mode: the board (linuxkms) and the browser.
std = ["slint/std"]
# Slint's MCU mode for microcontroller displays (the Tab5 on ESP-IDF): no
# system fonts; build.rs pre-renders the glyphs for the scale factor in
# KDS_UI_SCALE (e.g. 2.647 = 720/272 on the Tab5).
mcu = ["slint/unsafe-single-threaded", "slint/libm"]

[dependencies]
kitchen-protocol = { path = "../kitchen-protocol", version = "2.1.0" }
slint = { version = "1.18", default-features = false, features = ["compat-1-18"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# std::time::Instant / SystemTime panic on wasm32-unknown-unknown.
web-time = "1"
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Local time from the browser.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

[build-dependencies]
# sdf-fonts: the MCU build stores glyphs as signed distance fields (build.rs).
slint-build = { version = "1.18", features = ["sdf-fonts"] }

[dev-dependencies]
# examples/screenshots.rs: the software renderer, as on the Tab5, into PNGs.
slint = { version = "1.18", default-features = false, features = ["compat-1-18", "renderer-software"] }
png = "0.18"
