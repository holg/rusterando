[package]
name = "rusterando-shared"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Models, validation and asset-hashing shared by the Rusterando server, frontend and tooling"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Content hashing for the assets module (wasm/JS checksums + manifest).
# Pure-Rust, wasm32-compatible; only sha256_hex ships in the WASM bundle,
# the file/manifest helpers are cfg(not(wasm32)).
sha2 = "0.10"
