[package]
name = "rusterando-printer"
# 0.3.0: SVG-on-the-wire logos (kitchen-protocol 2.0.0) — the Pi
# rasterizes the server-composed logo SVG to 1-bit and caches it by content
# hash; bundles Poppins + resvg. 0.2.0 was the pure raster interpreter.
# The startup log's `version=` proves which build is running on the Pi.
version = "0.3.1"
edition = "2021"
# Not a workspace member, so metadata is spelled out instead of inherited.
license = "AGPL-3.0-or-later"
authors = ["Holger Trahe <trahe@mac.com>"]
repository = "https://github.com/holg/rusterando"
homepage = "https://github.com/holg/rusterando"
readme = "../../README.md"
keywords = ["restaurant", "printer", "escpos", "raspberry-pi"]
categories = ["hardware-support"]
description = "Kitchen receipt printer client for Rusterando (Raspberry Pi / ESC-POS), speaking kitchen-protocol over TCP"

# 0.3.1: kitchen display screen moved to crates/kds-ui (shared with the
# browser mirror); printing starts before the screen is free.
# Pi binary. Cross-compiles to aarch64-unknown-linux-gnu using the
# brew toolchain + the C23 shim from scripts/cross-shims/. Excluded
# from the main workspace (see top-level Cargo.toml) because its dep
# set differs from the server (escpos, file driver) and its target
# triple is always cross.
#
# Build from the repo root:
#   cargo build -p rusterando-printer \
#       --manifest-path crates/rusterando-printer/Cargo.toml \
#       --target aarch64-unknown-linux-gnu --release
#
# Or, since aws-lc-sys is gone now and the rest of the deps cross-
# compile cleanly, scripts/cross_build_on_mac.sh aarch64-linux-gnu
# will build it alongside rusterando-server once it's added to the
# leptos build (we don't — kept separate).

[[bin]]
name = "rusterando-printer"
path = "src/main.rs"

[dependencies]
# Protocol crate. Relative path because this crate isn't a workspace
# member — `{ workspace = true }` is unavailable here.
kitchen-protocol = { path = "../kitchen-protocol", version = "2.2.0" }
# The receipt → ESC/POS bytes, shared with the ESP32-P4 kitchen displays.
receipt-escpos = { path = "../receipt-escpos", version = "0.2.0", features = ["svg"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"

postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# ESC/POS receipt formatting. The escpos crate handles alignment,
# bold, size, cut commands so we don't hand-roll byte sequences.
# `codes_2d` enables the QR-code support used in the receipt footer.
escpos = { version = "0.16", features = ["codes_2d"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

anyhow = "1"
# Verify self-update artifacts against the server-supplied sha256 before
# installing. Pure-Rust, cross-compiles cleanly to aarch64.
sha2 = "0.10"
# Logo SVG → 1-bit raster: receipt-escpos's `svg` feature (resvg + the
# bundled Poppins), cached here by content hash (raster_cache). tiny-skia
# itself is still used by the kitchen display (kds).
tiny-skia = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Userspace USB printing (PRINTER_PATH=usb) for kernels without `usblp` —
# the STM32MP135F-DK's. Pure Rust over usbfs, no libusb.
nusb = "0.2"

# Kitchen display UI — see [features]. Software renderer only: the
# STM32MP135 has no GPU, and the desktop build uses the same renderer so
# what you see on the Mac is what the board draws.
# The screen itself (ui/kitchen.slint + its logic), shared with the browser
# mirror.
kds-ui = { path = "../kds-ui", optional = true }
slint = { version = "1.18", optional = true, default-features = false, features = ["std", "compat-1-18", "software-renderer-systemfonts"] }

# Screensaver handover on the board (kds-kms): DRM master + CRTC restore on
# Slint's own fd. Same version Slint's linuxkms backend links.
drm = { version = "0.14", optional = true }

[features]
default = []
# Kitchen display terminal: printer client + board subscription + Slint
# touch UI on the main thread. Pick one backend below.
kds = ["dep:kds-ui", "dep:slint"]
# Development window on macOS / desktop Linux.
kds-desktop = ["kds", "slint/backend-winit"]
# STM32MP135F-DK: straight to DRM/KMS + libinput touch, no seat daemon
# (the unit stops Weston and runs with video+input access).
# `drm` (same version Slint uses) lends the screen to the screensaver.
kds-kms = ["kds", "slint/backend-linuxkms-noseat", "slint/backend-linuxkms-libinput", "dep:drm"]

[profile.release]
lto = "thin"
strip = true
