[package]
name = "receipt-escpos"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A composed rusterando kitchen receipt as ESC/POS bytes"

# Pure: no device I/O, no async. Shared by every printing kitchen device —
# the Pi/STM32 printer client and the ESP32-P4 displays — so the printed
# bytes are the same everywhere. `escpos` without its driver features is
# encoding_rs + log only, which builds on ESP-IDF too.
[dependencies]
kitchen-protocol = { path = "../kitchen-protocol", version = "2.2.0" }
escpos = { version = "0.16", default-features = false, features = ["codes_2d"] }
anyhow = { workspace = true }
# Logos (feature `svg`): the server ships them as SVG; render + dither to
# 1-bit on the device. Pure Rust; the brand text uses the bundled Poppins
# (assets/fonts, OFL), never system fonts, so every device prints the same.
resvg = { version = "0.44", default-features = false, features = ["text", "raster-images"], optional = true }

[features]
default = []
svg = ["dep:resvg"]
