[package]
name = "kitchen-protocol"
version = "0.2.0"
edition = "2021"
description = "Shared DTOs for the rusterando kitchen channel"

# Pure-data crate: serde-only. Consumers (the server + the Pi binary) bring
# their own postcard / tokio_util / framing machinery. Keeping this crate
# dep-light means the Pi build (cross-compiled, separate workspace) doesn't
# inherit anything heavy from here.
[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
