# /etc/systemd/system/systemd-networkd-wait-online.service.d/any.conf
# The board has ports that are normally unplugged (second Ethernet, USB
# gadget); "online" = any one interface up, give up after 20 s instead of
# the default 2 min.
[Service]
ExecStart=
ExecStart=/lib/systemd/systemd-networkd-wait-online --any --timeout=20
