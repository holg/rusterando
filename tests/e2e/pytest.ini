[pytest]
# Default run excludes the demo scenarios (they need both a local server
# and visible browsers/recording). `pytest -m demo` overrides this —
# the CLI -m wins over the one in addopts.
addopts = -v --tb=short -m "not demo"
testpaths = .
# Visible-vs-headless is driven by HEADLESS=… in .env (see conftest).
# Pass --headed on the CLI to force visible regardless of env.
# pytest-playwright defaults to a fresh browser context per test —
# no cookie/session bleed between admin_page fixtures.
markers =
    demo: scripted two-browser demo scenarios that also record video
        (admin + customer side by side). Deselected from the normal run;
        opt in with `pytest -m demo`. See test_live_demo.py.
    no_sandbox_guard: test creates no data and never touches Stripe, so the
        autouse sandbox-mode guard is skipped and it runs even against a
        live shop (e.g. the auth-status heartbeat checks).
